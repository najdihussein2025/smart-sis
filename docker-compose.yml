# Local dev stack: SQL Server + API + web (+ AI service with --profile ai).
#   copy .env.example .env      (then set the passwords)
#   docker compose up --build
# Web:  http://localhost:3000      API docs: http://localhost:5080/scalar
# SSMS: server "localhost,14333", SQL auth, user "sa", password from .env

name: smart-sis

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    ports:
      # 14333 on your PC so it doesn't clash with a SQL Server already installed on 1433.
      - "${DB_PORT:-14333}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: ./backend
    environment:
      # Development = applies migrations + seeds simulated data on start, enables /scalar.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Sis: "Server=db,1433;Database=SmartSis;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (32+ characters)}
      Frontend__BaseUrl: "http://localhost:${WEB_PORT:-3000}"
      Seed__DevData: "true"
      Email__Provider: Log
      AiService__BaseUrl: http://ai:8000
      AiService__ServiceKey: ${AI_SERVICE_KEY:-}
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped

  ai:
    build: ./ai-service
    profiles: ["ai"]
    environment:
      SERVICE_KEY: ${AI_SERVICE_KEY:-}
      SIS_API_BASE_URL: http://api:8080
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "${AI_PORT:-8000}:8000"
    depends_on:
      - api

volumes:
  sqldata:
